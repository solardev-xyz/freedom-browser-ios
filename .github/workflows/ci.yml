# CI: build the Freedom app for the iOS Simulator, run the FreedomTests
# unit tests on a simulator, and build (and test, once it has test
# targets) the local SwarmKit package.
#
# Build once, test the products: `build-for-testing` compiles the app
# and the test bundle, `test-without-building` runs them, so the app is
# not compiled twice. Signing is ad-hoc ("Sign to Run Locally") with no
# team, so the hosted test bundle can load into the app on the simulator
# without any Apple account on the runner.
#
# Caching: SwiftPM checkouts and binary artifacts (the ~150 MB
# FreedomMobile.xcframework from solardev-xyz/freedom-mobile-ffi
# releases) live in a dedicated SourcePackages dir that is cached.
# Package.resolved is gitignored and the project's dependencies are
# version ranges (minimumVersion), so the manifests do not pin what gets
# resolved: the newest cache is restored by prefix, packages are
# resolved, and the cache is saved again under a key hashed from the
# freshly resolved pins whenever those differ from the restored ones. A
# new upstream release therefore refreshes the cache on its first run.
# DerivedData is not cached: it is large, tied to the exact Xcode build
# and its mtime-based invalidation makes restored caches unreliable.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: Freedom/Freedom.xcodeproj
  SCHEME: Freedom
  SPM_DIR: ${{ github.workspace }}/.ci/SourcePackages
  DERIVED_DATA: ${{ github.workspace }}/.ci/DerivedData

jobs:
  build-and-test:
    name: build + unit tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select newest release Xcode
        run: |
          # Versioned bundles only (Xcode_26.2.app, Xcode_26.0.1.app; the
          # bare Xcode.app is a symlink to one of them), and no beta /
          # RC / Release Candidate builds: a prerelease toolchain on the
          # image must not decide whether this check is green.
          XCODE=$(ls -d /Applications/Xcode_*.app \
            | grep -viE 'beta|_rc|release.?candidate' \
            | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "no release Xcode found"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          # First available iPhone on the newest iOS runtime that the
          # selected Xcode's simulator SDK supports (runtime <= SDK
          # version: a runtime installed for a newer, e.g. beta, Xcode is
          # skipped). The app targets iOS 26.2, so an older runtime would
          # not do either.
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iphonesimulator SDK $SDK"
          UDID=$(xcrun simctl list devices available -j | SDK="$SDK" python3 -c '
          import json, os, re, sys
          devs = json.load(sys.stdin)["devices"]
          sdk = tuple(map(int, os.environ["SDK"].split(".")[:2]))
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return tuple(map(int, m.groups())) if m else None
          rts = sorted((r for r in devs if ver(r) and ver(r) <= sdk),
                       key=ver, reverse=True)
          for rt in rts:
              for d in devs[rt]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          if [ -z "$UDID" ]; then
            echo "no iPhone simulator available"; xcrun simctl list devices; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      # The primary key never matches (the real key is only known after
      # resolving), so this always restores the newest cache by prefix.
      - name: Restore SwiftPM packages
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-restore
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        id: resolve
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR"
          # Key = the pins actually resolved (versions + revisions) plus
          # the local package manifests (binary target URL + checksum).
          RESOLVED="$PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ ! -f "$RESOLVED" ]; then
            echo "no Package.resolved after resolving: $RESOLVED"; exit 1
          fi
          HASH=$(cat "$RESOLVED" Packages/*/Package.swift | shasum -a 256 | cut -c1-16)
          echo "key=spm-${{ runner.os }}-$HASH" >> "$GITHUB_OUTPUT"

      # Saved right after resolution, so a red build/test run still keeps
      # the ~150 MB binary download for the next one. Skipped when the
      # restored cache already holds exactly these pins.
      - name: Save SwiftPM packages
        if: steps.spm-cache.outputs.cache-matched-key != steps.resolve.outputs.key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SPM_DIR }}
          key: ${{ steps.resolve.outputs.key }}

      - name: Build app + FreedomTests for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual

      - name: Run FreedomTests
        env:
          # Skipped in CI, with the reason. Tests that need the network, a
          # local node or a device already skip themselves unless opted in
          # (TEST_RUNNER_* env vars / a node on :1699), so they need no
          # entry here.
          #
          # Wall-clock-sensitive on a shared runner, where the host app's
          # own launch (live chain reads, node start) competes for the
          # main actor: the first asserts a fall-through in < 1 s (took
          # 1.8 s on macos-26), the second spins on Task.yield() until a
          # queue fills and never finished (hung the job for 45 min).
          #
          # OnchainAppPolicyTests drives a real WKWebView and polls for the
          # page for 15 s; on the runner the page never committed in that
          # window (title "", origin "null"; the WebContent/GPU/Networking
          # processes alone took 2-3 s each to launch), so its CSP/origin
          # checks stay a local-run test.
          SKIP_TESTS: >-
            FreedomTests/ChainDataAdaptiveTests/testBridgeReadsCarryThePageOrigin
            FreedomTests/ChainDataAdaptiveTests/testMyotisQueueFullFallsThroughImmediately
            FreedomTests/OnchainAppPolicyTests/testInlineScriptRunsAndFetchIsDeniedByCSP
        # The ChainData suites hold many tight wall-clock deadlines (e.g.
        # "fell through in < 0.4 s"); on a shared runner one occasionally
        # misses by a few tens of ms. A failing test is re-run up to
        # twice: a timing blip passes on retry, a real regression fails
        # every attempt and keeps the check red.
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -disableAutomaticPackageResolution \
            -only-testing:FreedomTests \
            $(for t in $SKIP_TESTS; do printf -- '-skip-testing:%s ' "$t"; done) \
            -retry-tests-on-failure -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/FreedomTests.xcresult"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FreedomTests.xcresult
          path: ${{ runner.temp }}/FreedomTests.xcresult
          if-no-files-found: ignore

      - name: SwarmKit package
        working-directory: Packages/SwarmKit
        run: |
          set -o pipefail
          DEST="platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          # SwarmKit is iOS-only (binary xcframework), so it is built with
          # xcodebuild for the simulator rather than `swift build`.
          xcodebuild build -scheme SwarmKit-Package -destination "$DEST" \
            -derivedDataPath "$DERIVED_DATA-swarmkit" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            CODE_SIGNING_ALLOWED=NO
          # Ask SwiftPM for the parsed manifest rather than grepping the
          # source, so a commented-out `.testTarget(...)` does not count.
          # Assigned first so a manifest that fails to parse fails the
          # step instead of silently skipping the tests.
          MANIFEST=$(swift package dump-package)
          if echo "$MANIFEST" | python3 -c '
          import json, sys
          targets = json.load(sys.stdin)["targets"]
          sys.exit(0 if any(t["type"] == "test" for t in targets) else 1)
          '; then
            xcodebuild test -scheme SwarmKit-Package -destination "$DEST" \
              -derivedDataPath "$DERIVED_DATA-swarmkit" \
              -clonedSourcePackagesDirPath "$SPM_DIR"
          else
            echo "::notice::Packages/SwarmKit declares no test targets: built only."
          fi
